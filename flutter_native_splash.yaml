# Colours the very first screen Android shows (before Flutter starts),
# so the app opens teal instead of flashing white.
# Run:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E4C4F"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#0E4C4F"
    image: assets/icon/app_icon_foreground.png
  web: false
